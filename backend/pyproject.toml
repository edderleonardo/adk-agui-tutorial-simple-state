[project]
name = "simple-state-backend"
version = "0.1.0"
description = "Backend simple con state de una palabra"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=0.5.0",
    "ag-ui-adk>=0.0.17",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]